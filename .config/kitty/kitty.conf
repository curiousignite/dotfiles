include hyde.conf

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

map ctrl+shift+n     ungrabbed
# map ctrl+shift+p     ungrabbed
map ctrl+shift+h     ungrabbed
map ctrl+shift+k     ungrabbed
map ctrl+shift+l     ungrabbed
map ctrl+shift+e     ungrabbed
map ctrl+shift+right scroll_page_down
tab_powerline_style slanted
confirm_os_window_close 0

# forward_remote_control yes
# allow_remote_control yes
# listen_on unix:@/tmp/mykitty
term xterm-256color
# clipboard_control write-clipboard write-primary read-clipboard read-primary
clipboard_control write-clipboard write-primary no-append

enabled_layouts splits:split_axis=horizontal
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/fzf --no-sort --no-mouse --tac -i
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

map alt+shift+h move_window left
map alt+shift+k move_window up
map alt+shift+j move_window down
map alt+shift+l move_window right

map ctrl+shift+/ launch --location=vsplit --cwd=current
map ctrl+shift+. launch --location=hsplit --cwd=current

map ctrl+shift+enter new_window_with_cwd

map ctrl+- change_font_size all -1.0
map ctrl+= change_font_size all +1.0

# Disable cliking links, unless ctrl is pressed
mouse_map left click ungrabbed mouse_handle_click prompt
mouse_map ctrl+left click ungrabbed mouse_handle_click link


font_family CaskaydiaCove Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
enable_audio_bell no
font_size 20.0
window_padding_width 5
# cursor_trail 1

# startup_session ~/.config/kitty/remote-session.conf

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
input_delay 0
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no

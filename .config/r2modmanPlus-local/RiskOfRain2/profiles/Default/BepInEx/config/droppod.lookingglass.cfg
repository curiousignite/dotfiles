## Settings file was created by plugin LookingGlass v1.15.2
## Plugin GUID: droppod.lookingglass

[Auto Sort Items]

## Where scrap should be sorted
# Setting type: ScrapSortMode
# Default value: Start
# Acceptable values: Off, Start, End
Scrap Sorting = Start

## Sorts by Tier
# Setting type: TierSortMode
# Default value: Tier
# Acceptable values: Off, Tier, TierIgnoringAcquiredOrder
Tier Sort = Tier

## How the tiers should be ordered
# Setting type: String
# Default value: Lunar FoodTier VoidBoss Boss VoidTier3 Tier3 VoidTier2 Tier2 VoidTier1 Tier1 NoTier
Tier Order = Lunar VoidBoss Boss VoidTier3 Tier3 VoidTier2 Tier2 VoidTier1 Tier1 NoTier

## Considers void tiers to be the same as their normal counterparts
# Setting type: Boolean
# Default value: false
Combine Normal And Void Tiers = false

## Sorts by Stack Size
# Setting type: StackSortType
# Default value: Largest_Smallest
# Acceptable values: Off, Largest_Smallest, Smallest_Largest
Stack Size Sort = Largest_Smallest

## Sorts quality items from ItemQualities mod
## 
## "Grouped" keeps all versions of a given item together, similar to the mod's own grouping
## "Separated" separates out qualities, similar to tier sorting
# Setting type: QualitySortType
# Default value: Grouped
# Acceptable values: Off, Grouped, Separated
Sort Quality Items = Grouped

## How qualities from ItemQualities mod should be ordered if quality sorting is on
# Setting type: QualitySortOrder
# Default value: RareToCommon
# Acceptable values: Off, RareToCommon, CommonToRare
Quality Items Order = RareToCommon

## Sorts Command menus by stack count or alphabetically.
## 
## 
# Setting type: CommandSortType
# Default value: Off
# Acceptable values: Off, Largest_Smallest, Smallest_Largest, A_Z, Z_A
Command Sorting = Off

## Sorts Scrapper by stack count or alphetically.
## 
## MatchHud will automatically use tier sorting and stacking sorting of the regular hud.
# Setting type: ScrapperSortType
# Default value: MatchHud
# Acceptable values: Off, MatchHud, Largest_Smallest, Smallest_Largest, A_Z, Z_A
Scrapper Sorting = MatchHud

## Sorts Scrapper by tier
# Setting type: Boolean
# Default value: true
Sort Scrapper by Tier = true

## Sorts Void Potentials & Aurelionite Fragments according to Scrapper rules.
# Setting type: Boolean
# Default value: false
Sort Potentials & Fragments = false

## Sort items on the game over screen & run reports.
# Setting type: Boolean
# Default value: false
Sort Death Screen Items = false

## Sort items in the Wandering Chef or any crafting station, according to scrapper rules (alphabetical sorting not supported). 
## 
## All items that cannot be used in any crafting recipe sorted to the bottom
# Setting type: Boolean
# Default value: true
Sort Crafting Menu = true

Descending Stack Size Sort = true

Sort Command Menu = false

Command Menu Descending = true

Sort Scrapper by stack = false

Scrapper Descending = true

Sort Command Menu Alphabetically = false

Command Menu Alphabetically Descending = true

Sort Scrapper Alphabetically = false

Scrapper Alphabetically Descending = true

Sort Death Screen & Monster Items = false


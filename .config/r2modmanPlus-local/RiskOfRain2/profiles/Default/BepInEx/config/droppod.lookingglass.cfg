# Setting type: Boolean
# Default value: true
Buff Timers = true

## Display buff timers with 1 decimal. 1.4 instead of rounding up to 2.
# Setting type: Boolean
# Default value: true
Buff Timers Decimal = true

## Changes the font size of buff timers
# Setting type: Single
# Default value: 80
Buff Timers Font Size = 80

## Gives descriptions to buffs (All vanilla by default, modded buffs need to be setup)
# Setting type: Boolean
# Default value: true
Buff Descriptions = true

## Changes the font size of buff descriptions
# Setting type: Single
# Default value: 100
Buff Font Size = 100

